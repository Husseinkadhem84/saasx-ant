<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" rx="40" fill="#0B0F19" />
  
  <defs>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Ambient background accent -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)" />
  <circle cx="400" cy="400" r="260" fill="#38bdf8" opacity="0.06" filter="url(#subtle-glow)" />

  <!-- Main Symbol Group -->
  <g transform="translate(400, 400) scale(1.15) translate(-400, -400)">
    <!-- Outer White Emblem Container -->
    <rect x="200" y="200" width="400" height="400" rx="32" fill="#FFFFFF" />

    <!-- Upper Black Wing -->
    <path d="M 230 260 L 515 260 L 515 285 L 610 285 L 530 400 L 400 400 L 345 320 L 330 400 L 230 400 Z" fill="#000000" />
    
    <!-- Lower Black Wing -->
    <path d="M 570 540 L 285 540 L 285 515 L 190 515 L 270 400 L 400 400 L 455 480 L 470 400 L 570 400 Z" fill="#000000" />

    <!-- Precise Geometric Structure -->
    <!-- Top-left slanted block -->
    <polygon points="190,260 490,260 410,400 310,400" fill="#000000" />
    <!-- Top-right corner wing -->
    <polygon points="505,285 615,285 535,400 455,400" fill="#000000" />
    <!-- Bottom-right slanted block -->
    <polygon points="610,540 310,540 390,400 490,400" fill="#000000" />
    <!-- Bottom-left corner wing -->
    <polygon points="295,515 185,515 265,400 345,400" fill="#000000" />

    <!-- Black central connector -->
    <polygon points="295,385 505,385 505,415 295,415" fill="#000000" />

    <!-- Pure White Central "X" Glyph with precise geometric cut -->
    <!-- Top-Left to Bottom-Right branch of X -->
    <polygon points="320,290 390,290 500,470 430,470" fill="#FFFFFF" />
    <!-- Top-Right to Bottom-Left branch of X -->
    <polygon points="480,290 410,290 300,470 370,470" fill="#FFFFFF" />

    <!-- Sharpened Center Overlap of X -->
    <g fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="miter">
      <!-- Upper V -->
      <polygon points="325,295 400,400 475,295 435,295 400,345 365,295" />
      <!-- Lower inverted V -->
      <polygon points="325,505 400,400 475,505 435,505 400,455 365,505" />
    </g>

    <!-- Clean Overlaid Primary X Silhouette -->
    <path d="M 330 300 L 400 395 L 470 300 L 530 300 L 435 400 L 530 500 L 470 500 L 400 405 L 330 500 L 270 500 L 365 400 L 270 300 Z" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  </g>
</svg>
