<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle depth -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="36" fill="#0c111c" />

  <!-- Subtle glow background circle -->
  <circle cx="300" cy="300" r="220" fill="#38bdf8" opacity="0.08" filter="blur(40px)" />

  <!-- Logo Container -->
  <g transform="translate(0, 0)" filter="url(#drop-shadow)">
    <!-- White Base Card for the Monogram (Crisp High-Contrast Presentation) -->
    <rect x="90" y="90" width="420" height="420" rx="24" fill="#FFFFFF" />

    <!-- Top Black Wing -->
    <path 
      d="M 125 195 L 320 195 L 398 210 L 338 290 L 210 290 L 125 195 Z" 
      fill="#000000" 
    />
    
    <!-- Top-Right Black Extension Framing X -->
    <path 
      d="M 320 195 L 400 195 L 400 210 L 320 210 Z" 
      fill="#000000" 
    />

    <!-- Bottom Black Wing -->
    <path 
      d="M 475 405 L 280 405 L 202 390 L 262 310 L 390 310 L 475 405 Z" 
      fill="#000000" 
    />

    <!-- Bottom-Left Black Extension Framing X -->
    <path 
      d="M 280 405 L 200 405 L 200 390 L 280 390 Z" 
      fill="#000000" 
    />

    <!-- Central White 'X' Geometry with crisp Black Contour -->
    <!-- Top-Left arm to Center -->
    <polygon points="215,215 270,215 300,270 245,270" fill="#FFFFFF" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Top-Right arm to Center -->
    <polygon points="385,215 330,215 300,270 355,270" fill="#FFFFFF" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- Bottom-Left arm to Center -->
    <polygon points="215,385 270,385 300,330 245,330" fill="#FFFFFF" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- Bottom-Right arm to Center -->
    <polygon points="385,385 330,385 300,330 355,330" fill="#FFFFFF" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- Center Bridge -->
    <polygon points="275,270 325,270 325,330 275,330" fill="#FFFFFF" />

    <!-- Inner clean fill pass to remove overlapping interior stroke seams -->
    <polygon points="215,215 270,215 385,385 330,385" fill="#FFFFFF" />
    <polygon points="385,215 330,215 215,385 270,385" fill="#FFFFFF" />

    <!-- Crisp outer border strokes on the outer branches of the white X -->
    <line x1="215" y1="215" x2="270" y2="215" stroke="#000000" stroke-width="8" stroke-linecap="square" />
    <line x1="330" y1="215" x2="385" y2="215" stroke="#000000" stroke-width="8" stroke-linecap="square" />
    <line x1="215" y1="385" x2="270" y2="385" stroke="#000000" stroke-width="8" stroke-linecap="square" />
    <line x1="330" y1="385" x2="385" y2="385" stroke="#000000" stroke-width="8" stroke-linecap="square" />

    <line x1="215" y1="215" x2="300" y2="300" stroke="#000000" stroke-width="8" />
    <line x1="385" y1="215" x2="300" y2="300" stroke="#000000" stroke-width="8" />
    <line x1="215" y1="385" x2="300" y2="300" stroke="#000000" stroke-width="8" />
    <line x1="385" y1="385" x2="300" y2="300" stroke="#000000" stroke-width="8" />
  </g>
</svg>
